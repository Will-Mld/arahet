<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1198px;height:827px;background:#FFFFFF;" width="1198px" height="827px" viewBox="0 0 1198 827" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="337.592" y="22.995" fill="#000" font-size="14" textLength="516.072" font-weight="700">D9 - Configured Go plugins; asynchronous derived-data feedback</text></g><!--entity cfg--><g class="entity" data-qualified-name="cfg" id="ent0001" data-source-line="2"><rect x="487.5" y="44.297" width="316.044" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="497.5" y="67.292" fill="#000" font-size="14" textLength="64.791">mkts.yml</text><text x="497.5" y="83.589" fill="#000" font-size="14" textLength="296.044">(default plugin examples are commented)</text></g><!--entity load--><g class="entity" data-qualified-name="load" id="ent0002" data-source-line="3"><rect x="513" y="189.297" width="264.651" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="523" y="212.292" fill="#000" font-size="14" textLength="139.501">plugins.Load(name)</text><text x="523" y="228.589" fill="#000" font-size="14" textLength="244.651">plugin.Open from GOPATH/bin or ./</text><text x="523" y="244.886" fill="#000" font-size="14" textLength="140.588">(plugins/load.go:44)</text></g><!--entity trig--><g class="entity" data-qualified-name="trig" id="ent0003" data-source-line="4"><rect x="148" y="320.297" width="335.417" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="158" y="343.292" fill="#000" font-size="14" textLength="98.089">Trigger plugin</text><text x="158" y="359.589" fill="#000" font-size="14" textLength="315.417">NewTrigger(config) -> Fire(keyPath, records)</text><text x="158" y="375.886" fill="#000" font-size="14" textLength="288.688">e.g. ondiskagg: 1Min -> 5Min/1H/1D bars</text></g><!--entity bg--><g class="entity" data-qualified-name="bg" id="ent0004" data-source-line="5"><rect x="518.5" y="320.297" width="254.008" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="528.5" y="343.292" fill="#000" font-size="14" textLength="116.881">BgWorker plugin</text><text x="528.5" y="359.589" fill="#000" font-size="14" textLength="217.513">NewBgWorker(config) -> Run()</text><text x="528.5" y="375.886" fill="#000" font-size="14" textLength="234.008">e.g. alpacabkfeeder, polygon, iex</text></g><!--entity disp--><g class="entity" data-qualified-name="disp" id="ent0005" data-source-line="6"><rect x="211.5" y="597.297" width="275.712" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="221.5" y="620.292" fill="#000" font-size="14" textLength="169.053">TriggerPluginDispatcher</text><text x="221.5" y="636.589" fill="#000" font-size="14" textLength="255.712">match 'on' pattern, fire in goroutine,</text><text x="221.5" y="652.886" fill="#000" font-size="14" textLength="189.793">recover panics (written.go)</text></g><!--entity w--><g class="entity" data-qualified-name="w" id="ent0006" data-source-line="7"><rect x="487.5" y="475.797" width="136.129" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="497.5" y="498.792" fill="#000" font-size="14" textLength="116.129">Writer.WriteCSM</text></g><!--entity q--><g class="entity" data-qualified-name="q" id="ent0007" data-source-line="8"><rect x="7" y="467.297" width="229.009" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="490.292" fill="#000" font-size="14" textLength="197.702">QueryService.ExecuteQuery</text><text x="17" y="506.589" fill="#000" font-size="14" textLength="209.009">planner + Reader (base data)</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="18"><path d="M158,727.297 L158,812.961 A0,0 0 0 0 158,812.961 L540.67,812.961 A0,0 0 0 0 540.67,812.961 L540.67,737.297 L530.67,727.297 L353.5,727.297 L349.5,666.537 L345.5,727.297 L158,727.297 A0,0 0 0 0 158,727.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M530.67,727.297 L530.67,737.297 L540.67,737.297 L530.67,727.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="164" y="744.364" fill="#000" font-size="13" textLength="361.67">Select base-data patterns to avoid unwanted feedback.</text><text x="164" y="759.497" fill="#000" font-size="13" textLength="277.443">Derived updates may lag Write responses.</text><text x="164" y="774.629" fill="#000" font-size="13" textLength="305.36">Crash-WAL replay writes primary data directly:</text><text x="164" y="789.762" fill="#000" font-size="13" textLength="278.256">aggregation/stream triggers are not rerun.</text><text x="164" y="804.895" fill="#000" font-size="13" textLength="326.365">Replica apply uses WriteCSM: replica triggers run.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="25"><path d="M808,319.297 L808,389.828 A0,0 0 0 0 808,389.828 L1183.256,389.828 A0,0 0 0 0 1183.256,389.828 L1183.256,329.297 L1173.256,319.297 L905.86,319.297 L736.54,258.357 L897.86,319.297 L808,319.297 A0,0 0 0 0 808,319.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1173.256,319.297 L1173.256,329.297 L1183.256,329.297 L1173.256,319.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="814" y="336.364" fill="#000" font-size="13" textLength="354.256">Go plugin.Open; plugins built with -buildmode=plugin.</text><text x="814" y="351.497" fill="#000" font-size="13" textLength="333.709">Load test runs only on Linux (plugins/load_test.go).</text><text x="814" y="366.629" fill="#000" font-size="13" textLength="275.406">contrib READMEs name Linux and macOS.</text><text x="814" y="381.762" fill="#000" font-size="13" textLength="159.72">WSL is one Linux option.</text></g><!--link cfg to load--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="9" data-link-type="dependency"><path d="M645.5,97.417 C645.5,122.657 645.5,156.367 645.5,184.087" style="stroke:#181818;stroke-width:1;" fill="none" id="cfg-to-load"/><polygon points="645.5,189.087,649.5,180.087,645.5,184.087,641.5,180.087,645.5,189.087" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="665.54" y="140.364" fill="#000" font-size="13" textLength="172.637">triggers: module/on/config</text><text x="646.5" y="155.497" fill="#000" font-size="13" textLength="210.717">bgworkers: module/name/config</text></g><!--link load to trig--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="10" data-link-type="dependency"><path d="M559.66,258.357 C510.86,277.427 454.627,299.417 405.857,318.477" style="stroke:#181818;stroke-width:1;" fill="none" id="load-to-trig"/><polygon points="401.2,320.297,411.039,320.746,405.857,318.477,408.127,313.295,401.2,320.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link load to bg--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-source-line="11" data-link-type="dependency"><path d="M645.5,258.357 C645.5,277.317 645.5,295.957 645.5,314.957" style="stroke:#181818;stroke-width:1;" fill="none" id="load-to-bg"/><polygon points="645.5,319.957,649.5,310.957,645.5,314.957,641.5,310.957,645.5,319.957" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link w to disp--><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" id="lnk11" data-source-line="12" data-link-type="dependency"><path d="M529.41,512.017 C497.15,533.317 445.663,567.312 404.783,594.302" style="stroke:#181818;stroke-width:1;" fill="none" id="w-to-disp"/><polygon points="400.61,597.057,410.325,595.436,404.783,594.302,405.917,588.76,400.61,597.057" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="472.5" y="563.364" fill="#000" font-size="13" textLength="357.64">normal flush records; may include primary-write errors</text></g><!--link disp to trig--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" id="lnk12" data-source-line="13" data-link-type="dependency"><path d="M345.35,597.227 C338.82,544.407 326.823,447.399 320.283,394.479" style="stroke:#181818;stroke-width:1;" fill="none" id="disp-to-trig"/><polygon points="319.67,389.517,316.804,398.94,320.283,394.479,324.744,397.958,319.67,389.517" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="336.5" y="498.364" fill="#000" font-size="13" textLength="130.432">Fire asynchronously</text></g><!--link bg to w--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk13" data-source-line="14" data-link-type="dependency"><path d="M629.16,389.577 C621.43,404.587 611.66,422.237 601.5,437.297 C592.4,450.787 583.982,461.132 574.652,471.742" style="stroke:#181818;stroke-width:1;" fill="none" id="bg-to-w"/><polygon points="571.35,475.497,580.297,471.38,574.652,471.742,574.289,466.097,571.35,475.497" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="612.5" y="433.364" fill="#000" font-size="13" textLength="170.27">write fetched market data</text></g><!--link trig to q--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk14" data-source-line="15" data-link-type="dependency"><path d="M152.17,389.427 C139.17,397.627 127.58,407.767 118.5,420.297 C108.89,433.557 108.754,447.16 111.994,462.15" style="stroke:#181818;stroke-width:1;" fill="none" id="trig-to-q"