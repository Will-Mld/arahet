ll="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1445.199" y="624.94" fill="#000" font-size="14" textLength="96.688">Replica writer</text><text x="1440.749" y="641.237" fill="#000" font-size="14" textLength="105.588">(default writer)</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg1" data-source-line="8"><polygon points="584.815,120.023,574.815,124.023,584.815,128.023,580.815,124.023" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="578.815" y1="124.023" x2="915.785" y2="124.023" style="stroke:#181818;stroke-width:1;"/><text x="590.815" y="118.958" fill="#000" font-size="13" textLength="318.97">GetWALStream() at startup / retryable reconnect</text></g><path d="M471.052,137.023 L471.052,192.023 L1019.052,192.023 L1019.052,147.023 L1009.052,137.023 L471.052,137.023" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1009.052,137.023 L1009.052,147.023 L1019.052,147.023 L1009.052,137.023" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="536.542" y="154.09" fill="#000" font-size="13" textLength="351.59">New subscriber channel: subsequent broadcasts only.</text><text x="536.542" y="169.223" fill="#000" font-size="13" textLength="390.749">No initial snapshot, historical cursor or remote-commit ACK.</text><text x="536.542" y="184.356" fill="#000" font-size="13" textLength="408.516">EOF and replay errors stop; other receive/connect errors retry.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg2" data-source-line="14"><polygon points="347.417,214.555,357.417,218.555,347.417,222.555,351.417,218.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="127.773" y1="218.555" x2="353.417" y2="218.555" style="stroke:#181818;stroke-width:1;"/><text x="134.773" y="213.489" fill="#000" font-size="13" textLength="207.645">Send(TG bytes) after WAL fsync</text></g><path d="M123.63,231.555 L123.63,377.555 L594.63,377.555 L594.63,241.555 L584.63,231.555 L123.63,231.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M584.63,231.555 L584.63,241.555 L594.63,241.555 L584.63,231.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="129.63" y="248.622" fill="#000" font-size="13" textLength="294.836">Send queues locally; no remote commit wait.</text><text x="129.63" y="263.754" fill="#000" font-size="13" textLength="450.576">Bounded queues, 500 groups each: the sender queue (sender.go:11)</text><text x="129.63" y="278.887" fill="#000" font-size="13" textLength="349.87">and each replica stream channel (grpc_server.go:15).</text><text x="129.63" y="294.02" fill="#000" font-size="13" textLength="394.78">A full replica channel blocks the fan-out (grpc_server.go:83),</text><text x="129.63" y="309.153" fill="#000" font-size="13" textLength="219.432">then Send, then the master flush.</text><text x="129.63" y="324.286" fill="#000" font-size="13" textLength="376.505">The channel map has no lock (grpc_server.go:52, 72, 81).</text><text x="129.63" y="339.418" fill="#000" font-size="13" textLength="414.47">A failed stream closes its channel (grpc_server.go:73) while the</text><text x="129.63" y="354.551" fill="#000" font-size="13" textLength="422.316">fan-out may be sending on it: the send panics, the master stops.</text><text x="129.63" y="369.684" fill="#000" font-size="13" textLength="390.908">Read from the code; no race detector or crash test was run.</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3" data-source-line="26"><polygon points="561.815,399.883,571.815,403.883,561.815,407.883,565.815,403.883" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="359.417" y1="403.883" x2="567.815" y2="403.883" style="stroke:#181818;stroke-width:1;"/><text x="366.417" y="398.817" fill="#000" font-size="13" textLength="190.398">SendReplicationMessage(TG)</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg4" data-source-line="27"><polygon points="904.785,429.016,914.785,433.016,904.785,437.016,908.785,433.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="573.815" y1="433.016" x2="910.785" y2="433.016" style="stroke:#181818;stroke-width:1;"/><text x="580.815" y="427.95" fill="#000" font-size="13" textLength="209.003">stream.Send(TransactionGroup)</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg5" data-source-line="28"><polygon points="1078.232,458.148,1088.232,462.148,1078.232,466.148,1082.232,462.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="916.785" y1="462.148" x2="1084.232" y2="462.148" style="stroke:#181818;stroke-width:1;"/><text x="923.785" y="457.083" fill="#000" font-size="13" textLength="72.712">Replay(TG)</text></g><g class="message" data-entity-1="part5" data-entity-2="part6" id="msg6" data-source-line="29"><polygon points="1481.543,487.281,1491.543,491.281,1481.543,495.281,1485.543,491.281" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1090.232" y1="491.281" x2="1487.543" y2="491.281" style="stroke:#181818;stroke-width:1;"/><text x="1097.232" y="486.215" fill="#000" font-size="13" textLength="379.311">ParseTGData -> WTSet -> ColumnSeriesMap -> WriteCSM</text></g><path d="M1288.446,504.281 L1288.446,589.281 L1698.446,589.281 L1698.446,514.281 L1688.446,504.281 L1288.446,504.281" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1688.446,504.281 L1688.446,514.281 L1698.446,514.281 L1688.446,504.281" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1294.446" y="521.348" fill="#000" font-size="13" textLength="318.417">HTTP Write uses injected ErrorWriter on replicas.</text><text x="1294.446" y="536.481" fill="#000" font-size="13" textLength="351.197">gRPC Write bypasses it via global executor.WriteCSM.</text><text x="1294.446" y="551.614" fill="#000" font-size="13" textLength="347.68">SQL INSERT INTO via Query (HTTP or gRPC) does too.</text><text x="1294.446" y="566.747" fill="#000" font-size="13" textLength="354.694">Create/Destroy mutate the catalog without this guard.</text><text x="1294.446" y="581.879" fill="#000" font-size="13" textLength="389.194">Deletes are not replicated; bootstrap/gap repair is external.</text><?plantuml-src TLLTRnf947pdLxJo11B68Ovb2qkHVDZXeWiE0NIyH3hDBitktCtExCs72V_-glSZmV95iiNkJ5TtLtNDRDJHC3tSqWNTXvFDI--iIu6CVcRQtN-cKEgwrhQueyov6A9NDUb0WMlbLUG1VgBETQrif3TB5IBx6NqqAPHpLrNAxiFM8SytEpmgCodSx6fwCtf3Aj1oznBikJOwLr4xEzcmtRDlmZPF3o_Z5klLVFqpTiF-cVqtk-28EfleMLKqB7oT_nMQBIdw_brRSx5vcQlBCwCrvwmbU9qiUlNzgpJyliMkvt--1giJ-qzLRIRjImELXmPusm5N_rkKZbv7wNouvuDA9dOB7MWtG46w-82UQKRdx8OZKf52HCvKqoLvZlwaCimHRJjhEOy3woAJ0mF0nz8vqHCVAQGiv5vdMCzBXL0pQzRutyHeBVDExNCCCP2pvZGHb2DjTTJAKB2g3gMBOofrYCw3Ww4y-U0yuSzpXQ8NESQk8ztF_n3uuvUF11DGgmgnzyx3FT7LT-HYoG9hfBxiEkz36bAJ0Nn0mcMmt8aMC0F447SCjmlAJf43n3X0jSQi1x7m6NVn3ZNX18A9uMk7fitf3acxXgbh-AXqb8v_SmdUwm5ZkdxxbWhlKXs8LLxE25t3_kBFDeQ6xPkCV3eT8OKGbbZgB0s-ZIixoL-vStezaihtT4Z6_03rqHbw_YSqPG_ANhWKNoMulHgDaG0Xjc4xRXy5KZL7aWvo8gN85cjzvWfdkOJNe8NKU9Ns-jsORl1_E-txKzf0cfwESG6IQhZbLynkhaPqB06INf2Y9r312rah8-uMc0rPVYfBE2Sw3-Dp0cAP85siMUtfu5tLxEPkp-qmLSwqvmWBjNRClGebmI0oMlWfsJCtYO_weoM2dTqdImv15Gn_ZGROHvISmrb7Uj9wpoiRL2xX2x76g3-hwnN9NI9URnBWNLPtM5qf7tYxU51HoTfkk-4e3tDdKYMtcEQmn41aJ-w1-MPvvcHS1qI_RxUhTfDIexpz6tGna4SvCys65oqx1pLo5RWjEqnsgbLe9qRFMb5XN8OJpDyvJn1jqfSLsERhP_hqj7bSR_6p_TB4VqtiJpHike30adb4UuU4qJa1pQ5GvCi7QExTYQeKyTgE2QoDA-YeOodpZxX1g4ZAxmNtm0Q32wGyotZw_i7ixAjpMK0Sx2ZjvGF4tq7MufFoOwZ_0G00?></g></svg>