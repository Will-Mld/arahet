 L22.5,305.094 A2.5,2.5 0 0 0 25,307.594 L338.655,307.594 A2.5,2.5 0 0 0 341.155,305.094 L341.155,281.297 L331.155,271.297 L25,271.297 A2.5,2.5 0 0 0 22.5,273.797" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M331.155,271.297 L331.155,278.797 A2.5,2.5 0 0 0 333.655,281.297 L341.155,281.297" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><text x="32.5" y="294.292" fill="#000" font-size="14" textLength="298.655">WALFile.&lt;nanosecond-timestamp>.walfile</text></g><!--entity f2017--><g class="entity" data-qualified-name="data.sym.tf.ag.f2017" id="ent0005" data-source-line="7"><path d="M539,273.797 L539,305.094 A2.5,2.5 0 0 0 541.5,307.594 L618.229,307.594 A2.5,2.5 0 0 0 620.729,305.094 L620.729,281.297 L610.729,271.297 L541.5,271.297 A2.5,2.5 0 0 0 539,273.797" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M610.729,271.297 L610.729,278.797 A2.5,2.5 0 0 0 613.229,281.297 L620.729,281.297" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><text x="549" y="294.292" fill="#000" font-size="14" textLength="61.729">2017.bin</text></g><!--entity f2018--><g class="entity" data-qualified-name="data.sym.tf.ag.f2018" id="ent0006" data-source-line="8"><path d="M422,273.797 L422,305.094 A2.5,2.5 0 0 0 424.5,307.594 L501.229,307.594 A2.5,2.5 0 0 0 503.729,305.094 L503.729,281.297 L493.729,271.297 L424.5,271.297 A2.5,2.5 0 0 0 422,273.797" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M493.729,271.297 L493.729,278.797 A2.5,2.5 0 0 0 496.229,281.297 L503.729,281.297" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><text x="432" y="294.292" fill="#000" font-size="14" textLength="61.729">2018.bin</text></g><!--entity hdr--><g class="entity" data-qualified-name="layout.hdr" id="ent0009" data-source-line="15"><rect x="364" y="479.297" width="432.118" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="374" y="502.292" fill="#000" font-size="14" textLength="272.638">Header: 37024 bytes, format version 2</text><text x="374" y="518.589" fill="#000" font-size="14" textLength="372.135">version, description, year, timeframe (nanoseconds),</text><text x="374" y="534.886" fill="#000" font-size="14" textLength="364.048">record type (fixed | variable), nfields, record length,</text><text x="374" y="551.183" fill="#000" font-size="14" textLength="412.118">element names [1024][32]byte, element types [1024]byte</text></g><!--entity r1--><g class="entity" data-qualified-name="layout.r1" id="ent0010" data-source-line="16"><rect x="262" y="649.797" width="635.809" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="272" y="672.792" fill="#000" font-size="14" textLength="527.331">Fixed record for interval 1: index int64 | Open | High | Low | Close | Volume</text><text x="272" y="689.089" fill="#000" font-size="14" textLength="615.809">slot length = header record length: 8 + column bytes rounded up to the machine word;</text><text x="272" y="705.386" fill="#000" font-size="14" textLength="494.512">the writer appends no pad bytes, so any rounding gap stays unwritten</text></g><!--entity holes--><g class="entity" data-qualified-name="layout.holes" id="ent0011" data-source-line="17"><rect x="346.5" y="812.297" width="466.51" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="356.5" y="835.292" fill="#000" font-size="14" textLength="446.51">... (sparse slots; index 0 is skipped; allocation is block-granular)</text></g><!--entity rn--><g class="entity" data-qualified-name="layout.rn" id="ent0012" data-source-line="18"><rect x="478" y="917.797" width="203.9" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="488" y="940.792" fill="#000" font-size="14" textLength="183.9">Fixed record for interval N</text></g><!--entity vr--><g class="entity" data-qualified-name="layout.vr" id="ent0013" data-source-line="19"><rect x="845.5" y="503.797" width="464.609" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="855.5" y="526.792" fill="#000" font-size="14" textLength="444.609">Variable slot: index int64 | offset int64 | length int64 (24 bytes)</text></g><!--entity vp--><g class="entity" data-qualified-name="layout.vp" id="ent0014" data-source-line="20"><rect x="932.5" y="641.797" width="379.324" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="942.5" y="664.792" fill="#000" font-size="14" textLength="347.676">Variable payload tail: multiple events per interval</text><text x="942.5" y="681.089" fill="#000" font-size="14" textLength="359.324">merge old + new, timestamp sort, optional Snappy</text><text x="942.5" y="697.386" fill="#000" font-size="14" textLength="353.233">stored event: data columns + uint32 interval ticks</text><text x="942.5" y="713.683" fill="#000" font-size="14" textLength="286.576">(Epoch and Nanoseconds are not stored)</text></g><!--entity api--><g class="entity" data-qualified-name="api" id="ent0015" data-source-line="22"><rect x="1358.5" y="803.797" width="474.904" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1368.5" y="826.792" fill="#000" font-size="14" textLength="258.788">Query result row (rebuilt, not stored)</text><text x="1368.5" y="843.089" fill="#000" font-size="14" textLength="454.904">Epoch seconds (8 bytes) | data columns | Nanoseconds (4 bytes)</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="30"><path d="M1359,478.797 L1359,564.461 L1979.085,564.461 L1979.085,488.797 L1969.085,478.797 L1359,478.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1969.085,478.797 L1969.085,488.797 L1979.085,488.797 L1969.085,478.797" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1365" y="495.864" fill="#000" font-size="13" textLength="290.627">offset = header + (index - 1) * record length</text><text x="1365" y="510.997" fill="#000" font-size="13" textLength="347.756">intraday index = 1 + (time - Jan 1 00:00) / timeframe</text><text x="1365" y="526.129" fill="#000" font-size="13" textLength="599.085">daily index = YearDay() - 1 (Jan 1 -> 0: its slot falls inside the header; reads never return it)</text><text x="1365" y="541.262" fill="#000" font-size="13" textLength="396.437">Fixed writes overwrite slots; variable writes merge payloads.</text><text x="1365" y="556.395" fill="#000" font-size="13" textLength="385.652">(utils/io/timeindex.go; executor/writer.go, rewritebuffer.go)</text></g><!--link f2017 to hdr--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" id="lnk16" data-source-line="23" data-link-type="dependency"><path d="M580,307.617 C580,343.747 580,422.977 580,474.087" style="stroke:#181818;stroke-width:1;" fill="none" id="f2017-to-hdr"/><polygon points="580,479.087,584,470.087,580,474.087,576,470.087,580,479.087" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link hdr to r1--><!--link r1 to holes--><!--link holes to rn--><!--link vr to vp--><g class="link" data-entity-1="ent0013" data-entity-2="ent0014" id="lnk20" data-source-line="27" data-link-type="dependency"><path d="M1082.71,539.977 C1089.32,564.077 1100.218,603.845 1109.288,636.925" style="stroke:#181818;stroke-width:1;" fill="none" id="vr-to-vp"/><polygon points="1110.61,641.747,1112.088,632.01,1109.288,636.925,1104.373,634.125,1110.61,641.747" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1102" y="607.864" fill="#000" font-size="13" textLength="160.843">indirect payload location</text></g><!--link vp to api--><g class="link" data-entity-1="ent0014" data-entity-2="ent0015" id="lnk21" data-source-line="28" data-link-type="dependency"><path d="M1258.78,726.847 C1340.55,751.687 1437.036,781.0